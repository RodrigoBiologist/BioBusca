<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioBusca 1.0 — Mapa conceitual</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17352d;background:#f3f7f5}*{box-sizing:border-box}body{margin:0}.shell{max-width:1050px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 40px #153c2610}header{background:#10372d;color:white;padding:26px 28px}header h1{margin:0;font-size:29px}header p{color:#c3e5d6;margin:5px 0 20px}.search{display:flex;gap:8px}.search input{flex:1;min-width:0;padding:15px;border-radius:10px;border:1px solid #d4ded9;font-size:17px}.btn{background:#177a57;color:white;border:0;border-radius:9px;padding:12px 17px;cursor:pointer;font-weight:650}.btn.secondary{background:#e9f3ee;color:#164c39}.btn:focus-visible,input:focus-visible{outline:3px solid #f6bb45}main{padding:25px 28px}h2{font-size:22px;margin:8px 0 15px}h3{font-size:17px;margin:8px 0}p{line-height:1.65}.muted{color:#61746b;font-size:13px}.tag{display:inline-block;border-radius:30px;background:#e9f4ee;color:#176046;padding:6px 10px;font-size:12px;margin:3px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{border:1px solid #dce6e0;border-radius:12px;padding:17px;background:#fff}.card.click{cursor:pointer;text-align:left;color:inherit;width:100%;font:inherit}.card.click:hover{border-color:#177a57;background:#f7fbf9}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}.tabs button{border:1px solid #b8d2c5;border-radius:8px;background:#fff;padding:10px 13px;cursor:pointer}.tabs button.active{background:#176a4c;color:#fff}.notice{border-left:4px solid #d9a33e;background:#fff8e8;padding:13px;margin:15px 0}.answer{display:block;padding:10px;border:1px solid #dae7e0;border-radius:8px;margin:7px 0;cursor:pointer}.answer:has(input:checked){border-color:#177a57;background:#f0f9f3}.hidden{display:none}footer{padding:20px 28px;border-top:1px solid #e2e9e5;color:#5b7064;font-size:12px}a{color:#116749}button:disabled{opacity:.5;cursor:not-allowed}@media(max-width:550px){header,main{padding:20px 16px}.search{flex-direction:column}}</style></head><body><div class="shell"><header><h1>🧬 BioBusca <span style="font-size:12px;background:#2b624c;border-radius:20px;padding:5px 9px;vertical-align:middle">VERSÃO 1.0</span></h1><p>Uma palavra. A Biologia por trás dela.</p><form class="search" id="searchForm"><input id="searchInput" placeholder="Digite uma palavra, por exemplo: futebol, praia, ATP..." aria-label="Palavra para pesquisar" required><button class="btn">Descobrir conexões</button></form></header><main><div id="view"></div></main><footer>BioBusca 1.0 · Protótipo local · Artigos consultados online; fichas didáticas demonstrativas sem validação editorial formal. Questões autorais, não atribuídas a exames oficiais.</footer></div><script>
const concepts={
mitocondria:{name:'Mitocôndria',area:'Biologia Celular',sub:'Organelas e metabolismo energético',school:'A mitocôndria é uma organela das células eucarióticas associada à respiração celular e à produção de ATP.',uni:'A membrana interna mitocondrial abriga a cadeia transportadora de elétrons e a ATP sintase. O gradiente eletroquímico de prótons impulsiona a fosforilação oxidativa.',keywords:['ATP','Cristas mitocondriais','Respiração celular'],q:'Onde se localiza a ATP sintase responsável pela fosforilação oxidativa?',opts:['Na membrana interna mitocondrial','No nucléolo','No lisossomo','Na parede celular'],correct:0,why:'A ATP sintase está na membrana interna mitocondrial.'},
osmose:{name:'Osmose',area:'Biologia Celular',sub:'Transporte através de membranas',school:'Osmose é o fluxo líquido de água através de uma membrana seletivamente permeável, associado a diferenças de potencial hídrico.',uni:'O fluxo osmótico depende de gradientes de potencial químico da água e das propriedades de permeabilidade da membrana. Tonicidade depende dos solutos efetivamente não permeantes.',keywords:['Tonicidade','Potencial hídrico','Plasmólise'],q:'Uma célula vegetal em meio fortemente hipertônico tende a:',opts:['Ganhar água indefinidamente','Perder água e sofrer plasmólise','Duplicar o DNA','Produzir mais clorofila'],correct:1,why:'A água sai da célula, podendo ocorrer plasmólise.'},
selecao:{name:'Seleção natural',area:'Biologia Evolutiva',sub:'Mecanismos evolutivos',school:'A seleção natural favorece características hereditárias associadas a maior sucesso reprodutivo em determinado ambiente.',uni:'A seleção natural altera frequências de variantes hereditárias quando diferenças fenotípicas afetam a aptidão. Deriva genética, fluxo gênico e mutação também participam da evolução.',keywords:['Adaptação','Variabilidade','Aptidão'],q:'Uma variante hereditária aumenta em frequência por favorecer a reprodução. Isso exemplifica:',opts:['Uso e desuso','Geração intencional de mutações','Seleção natural','Ausência de evolução'],correct:2,why:'Diferenças hereditárias de sucesso reprodutivo caracterizam seleção natural.'},
fotossintese:{name:'Fotossíntese',area:'Fisiologia Vegetal',sub:'Metabolismo fotossintético',school:'Na fotossíntese oxigênica, organismos usam luz para sustentar a síntese de matéria orgânica e liberam oxigênio proveniente da água.',uni:'Reações fotoquímicas nos tilacoides geram ATP e NADPH, utilizados na fixação de carbono pelo ciclo de Calvin-Benson.',keywords:['Cloroplasto','Clorofila','Fixação de carbono'],q:'Na fotossíntese oxigênica, o O₂ liberado provém principalmente:',opts:['Da glicose','Da água','Do CO₂','Do ATP'],correct:1,why:'O oxigênio molecular é liberado pela oxidação da água.'},
meiose:{name:'Meiose',area:'Genética',sub:'Divisão celular e variabilidade',school:'A meiose envolve duas divisões após uma duplicação do DNA e contribui para formar células haploides e gerar variabilidade genética.',uni:'Na prófase I, homólogos pareiam e podem recombinar; na anáfase I ocorre segregação dos homólogos, e na anáfase II, das cromátides-irmãs.',keywords:['Crossing-over','Segregação','Haploidia'],q:'A separação de cromossomos homólogos ocorre principalmente na:',opts:['Prófase I','Anáfase I','Metáfase II','Telófase II'],correct:1,why:'Os homólogos se separam na anáfase I.'},
contracao:{name:'Contração muscular',area:'Fisiologia Humana',sub:'Sistema muscular',school:'A contração muscular depende da interação entre actina e miosina, com consumo de ATP.',uni:'O Ca²⁺ liga-se à troponina, desloca a tropomiosina e permite ciclos de pontes cruzadas entre actina e miosina dependentes de ATP.',keywords:['Actina','Miosina','ATP'],q:'Qual molécula é consumida diretamente no ciclo das pontes cruzadas?',opts:['DNA','ATP','Celulose','Clorofila'],correct:1,why:'O ATP participa do ciclo mecanoquímico da miosina.'},
cafeina:{name:'Cafeína e sistema nervoso',area:'Neurofisiologia',sub:'Modulação da atividade neural',school:'A cafeína é uma substância presente no café que atua no sistema nervoso, principalmente bloqueando receptores de adenosina.',uni:'A cafeína antagoniza receptores de adenosina, especialmente A1 e A2A, influenciando estados de alerta e circuitos de neurotransmissão.',keywords:['Cafeína','Adenosina','Receptores'],q:'Um mecanismo importante da cafeína no sistema nervoso é:',opts:['Bloqueio de receptores de adenosina','Síntese direta de DNA','Destruição de ribossomos','Inibição da fotossíntese'],correct:0,why:'A cafeína atua principalmente como antagonista de receptores de adenosina.'},
restinga:{name:'Ecologia de restinga',area:'Ecologia',sub:'Ecossistemas costeiros',school:'A restinga reúne comunidades vegetais associadas a ambientes costeiros, com espécies adaptadas a condições como salinidade, vento e solos arenosos.',uni:'Comunidades de restinga apresentam gradientes ambientais, filtros edáficos e fisiológicos e processos de sucessão e interação biótica que variam espacialmente.',keywords:['Salinidade','Solo arenoso','Biodiversidade'],q:'Uma pressão ambiental frequente em ambientes de restinga é:',opts:['Ausência permanente de luz','Salinidade e baixa retenção de água no solo','Ausência de vento','Temperatura constante'],correct:1,why:'Salinidade e disponibilidade hídrica podem representar importantes filtros ambientais.'},
circadiano:{name:'Ritmos circadianos',area:'Fisiologia Humana',sub:'Cronobiologia',school:'Ritmos circadianos são oscilações biológicas de aproximadamente 24 horas, influenciadas pela alternância de luz e escuridão.',uni:'O núcleo supraquiasmático participa da coordenação de ritmos circadianos; sinais luminosos contribuem para sincronizar os relógios biológicos.',keywords:['Sono','Luz','Relógio biológico'],q:'Um estímulo ambiental importante para sincronizar ritmos circadianos é:',opts:['Luz','Salinidade','Gravidade lunar apenas','Clorofila'],correct:0,why:'A luz é um importante sincronizador circadiano.'},
cacau:{name:'Cacaueiro',area:'Botânica',sub:'Angiospermas e ecologia agrícola',school:'O cacaueiro, Theobroma cacao, é uma angiosperma cultivada por suas sementes, utilizadas na produção de chocolate.',uni:'Theobroma cacao pertence à família Malvaceae. Seu cultivo envolve processos de polinização, formação de frutos e interações agroecológicas.',keywords:['Theobroma cacao','Fruto','Polinização'],q:'O cacau utilizado na fabricação do chocolate provém principalmente:',opts:['Das raízes','Das sementes','Das folhas','Do pólen'],correct:1,why:'O chocolate é produzido a partir de sementes de cacau processadas.'}
};
const associations=[{terms:['futebol','corrida','esporte','academia','musculo','exercicio'],label:'Atividade física',items:[['contracao','A atividade muscular depende de actina, miosina e ATP.','direta'],['mitocondria','O metabolismo energético sustenta a atividade física.','direta'],['circadiano','Sono e recuperação se relacionam ao desempenho.','indireta']]},{terms:['cafe','cafeina','espresso','cappuccino'],label:'Café',items:[['cafeina','A cafeína influencia a sinalização nervosa.','direta'],['cacau','Plantas cultivadas permitem comparar fisiologia e ecologia agrícola.','interdisciplinar']]},{terms:['praia','mar','areia','litoral','oceano','penha'],label:'Ambiente costeiro',items:[['restinga','A vegetação de restinga ocorre em ambientes costeiros.','direta'],['osmose','Gradientes de salinidade afetam a movimentação de água.','indireta']]},{terms:['celular','smartphone','tela','internet','luz azul','sono'],label:'Tecnologia e organismo',items:[['circadiano','A exposição à luz pode influenciar ritmos biológicos.','indireta'],['cafeina','O estado de alerta também pode ser modulado por substâncias.','interdisciplinar']]},{terms:['chocolate','cacau','doce','bombom'],label:'Chocolate',items:[['cacau','O chocolate é produzido a partir de sementes do cacaueiro.','direta'],['cafeina','O cacau contém metilxantinas, como teobromina e alguma cafeína.','indireta']]},{terms:['energia','atp','respiracao','metabolismo'],label:'Energia biológica',items:[['mitocondria','A mitocôndria participa do metabolismo energético.','direta'],['fotossintese','A fotossíntese transforma energia luminosa em energia química.','indireta']]},{terms:['evolucao','darwin','adaptacao','inseticida'],label:'Evolução',items:[['selecao','A seleção natural é um mecanismo evolutivo.','direta'],['meiose','A meiose contribui para a variabilidade hereditária.','indireta']]}];
const view=document.getElementById('view'),input=document.getElementById('searchInput');let current=null,level='school',tab='content',selectedAnswer=-1;const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function buttonCard(id,desc,type){let c=concepts[id];return `<button class="card click" data-open="${id}"><strong>${esc(c.name)}</strong><p class="muted">${esc(c.area)} · ${esc(c.sub)}</p>${desc?`<p>${esc(desc)}</p>`:''}${type?`<span class="tag">Relação ${esc(type)}</span>`:''}</button>`}function home(){view.innerHTML=`<h2>Explore a Biologia em qualquer contexto</h2><p>Pesquise palavras do cotidiano ou conceitos científicos. Para testar: futebol, praia, chocolate, celular, energia, evolução.</p><div class="notice"><strong>Limite desta demonstração:</strong> as conexões foram preparadas previamente. Palavras não cadastradas não geram associações automaticamente.</div><h3>Conceitos iniciais</h3><div class="grid">${Object.keys(concepts).map(id=>buttonCard(id)).join('')}</div>`;bind()}function search(q){const n=norm(q);let direct=Object.keys(concepts).filter(id=>norm(concepts[id].name).includes(n)||norm(id).includes(n)||concepts[id].keywords.some(k=>norm(k).includes(n)));let group=associations.find(g=>g.terms.some(t=>norm(t)===n));if(!group&&!direct.length&&n.length>2){group=associations.find(g=>g.terms.some(t=>norm(t).includes(n)||n.includes(norm(t))))}let html=`<button class="btn secondary" id="back">← Início</button><h2>Pesquisa: ${esc(q)}</h2>`;if(group){html+=`<p class="muted">Contexto identificado: ${esc(group.label)} · Associação demonstrativa</p><div class="grid">${group.items.map(x=>buttonCard(x[0],x[1],x[2])).join('')}</div>`}else if(direct.length){html+=`<p class="muted">Conceitos correspondentes no catálogo local</p><div class="grid">${direct.map(id=>buttonCard(id)).join('')}</div>`}else{html+=`<div class="notice"><strong>Não encontramos uma associação validada no catálogo local.</strong><p>Na versão conectada, a palavra será interpretada por um motor semântico, e as relações propostas passarão por verificação científica. Nenhuma associação será inventada aqui.</p></div><h3>Explore outros conceitos</h3><div class="grid">${Object.keys(concepts).slice(0,5).map(id=>buttonCard(id)).join('')}</div>`}view.innerHTML=html;document.getElementById('back').onclick=home;bind()}
function detail(id){current=id;let c=concepts[id];let inner='';if(tab==='content'){inner=`<h3>Explicação — ${level==='school'?'Ensino Médio':'Universitário'}</h3><p>${esc(c[level])}</p><h3>Classificação</h3><p><span class="tag">${esc(c.area)}</span><span class="tag">${esc(c.sub)}</span></p>`}if(tab==='terms'){inner=`<h3>Palavras-chave</h3>${c.keywords.map(k=>`<span class="tag">${esc(k)}</span>`).join('')}<p class="muted">Sinônimos científicos formais ainda não foram auditados neste protótipo.</p>`}if(tab==='questions'){inner=`<div class="notice">Questão <strong>autoral demonstrativa</strong>, não retirada de ENEM ou vestibular.</div><h3>${esc(c.q)}</h3>${c.opts.map((o,i)=>`<label class="answer"><input type="radio" name="answer" value="${i}" ${selectedAnswer===i?'checked':''}> ${'ABCD'[i]}) ${esc(o)}</label>`).join('')}<button class="btn" id="check">Conferir resposta</button><div id="feedback"></div><p class="muted">O banco de questões oficiais e os vínculos com instituições e anos ainda serão implementados.</p>`}if(tab==='sources'){inner=`<h3>Fontes de referência para futura curadoria</h3><p><a href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank" rel="noopener">PubMed</a> · <a href="https://www.ncbi.nlm.nih.gov/" target="_blank" rel="noopener">NCBI</a> · <a href="https://www.uniprot.org/" target="_blank" rel="noopener">UniProt</a></p><div class="notice">Nenhuma referência específica foi vinculada ou verificada para esta ficha. Status editorial: demonstração.</div>`}view.innerHTML=`<button class="btn secondary" id="back">← Nova pesquisa</button><h2>${esc(c.name)}</h2><p class="muted">${esc(c.area)} / ${esc(c.sub)}</p><div class="notice">Ficha demonstrativa · Revisão científica formal pendente</div><div class="tabs"><button data-level="school" class="${level==='school'?'active':''}">Ensino Médio</button><button data-level="uni" class="${level==='uni'?'active':''}">Universitário</button></div><div class="tabs">${[['content','Conteúdo'],['terms','Palavras-chave'],['questions','Questões'],['sources','Fontes']].map(([t,l])=>`<button data-tab="${t}" class="${tab===t?'active':''}">${l}</button>`).join('')}</div><section class="card">${inner}</section>`;document.getElementById('back').onclick=()=>{input.focus();home()};document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;detail(id)});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;selectedAnswer=-1;detail(id)});if(tab==='questions'){document.querySelectorAll('input[name=answer]').forEach(r=>r.onchange=()=>selectedAnswer=+r.value);document.getElementById('check').onclick=()=>{let f=document.getElementById('feedback');f.innerHTML=selectedAnswer<0?'<p>Selecione uma alternativa.</p>':`<div class="notice"><strong>${selectedAnswer===c.correct?'Correto!':'Resposta a revisar.'}</strong><p>Gabarito: ${'ABCD'[c.correct]}. ${esc(c.why)}</p></div>`}}}
function bind(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{tab='content';level='school';selectedAnswer=-1;detail(b.dataset.open)})}
// BioBusca 0.6: a busca preserva o catálogo 0.3 e consulta o backend quando disponível.
const originalSearch=search;
search=async function(q){
  if(!q.trim()){home();return}
  originalSearch(q);
  const existing=view.innerHTML;
  const box=document.createElement('section');box.className='card';box.id='liveResults';
  box.innerHTML='<h3>🔬 Motor de busca 1.0</h3><p class="muted">Consultando o catálogo e o serviço semântico local...</p>';
  view.insertBefore(box,view.children[2]||null);
  try{
    const response=await fetch('/api/search?q='+encodeURIComponent(q));
    if(!response.ok)throw new Error('offline');
    const data=await response.json();
    if(!box.isConnected)return;
    let matches=[...(data.matches||[]),...(data.inferred||[])];
    box.innerHTML='<h3>🔬 Busca conectada</h3><p class="muted">'+esc(data.note||'')+'</p>'+
      (matches.length?'<div class="grid">'+matches.map(m=>buttonCard(m.id,m.reason||'Correspondência no catálogo',m.type||'lexical')).join('')+'</div>':'<p>Nenhuma associação confirmada. Não vamos inventar uma relação biológica.</p>')+
      '<p class="muted">As associações inferidas pela IA não foram revisadas cientificamente.</p>';
    bind();
  }catch(e){if(box.isConnected)box.innerHTML='<h3>🔬 Motor de busca 1.0</h3><p class="muted">Servidor não conectado. A demonstração local 0.3 continua disponível. Para a busca ampliada, execute server.py.</p>'}
};
const originalDetail=detail;
detail=function(id){originalDetail(id);if(tab==='sources'){
 const section=view.querySelector('section.card');
 const el=document.createElement('div');el.className='notice';
 el.innerHTML='<h3>Literatura científica (consulta automática)</h3><div id="evidenceResults">Buscando referências bibliográficas...</div>';
 section.appendChild(el);
 fetch('/api/evidence?q='+encodeURIComponent(concepts[id].name)).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{
 const target=document.getElementById('evidenceResults');if(!target)return;
 target.innerHTML='<p class="muted">Resultados bibliográficos não auditados. A presença de um artigo não valida automaticamente o conteúdo da ficha.</p>'+
 (d.results||[]).map(r=>'<p><a target="_blank" rel="noopener" href="'+esc(r.url)+'">'+esc(r.title||'Artigo')+'</a><br><small>'+esc(r.journal)+' · '+esc(r.year)+' · DOI: '+esc(r.doi||'não informado')+'</small></p>').join('')||'Nenhum resultado encontrado.';
 }).catch(()=>{const target=document.getElementById('evidenceResults');if(target)target.textContent='Consulta externa indisponível. Execute o servidor local com acesso à internet.'});
 }};

document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();search(input.value)};home();
</script><script>
(function(){
const escLit=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lit=document.createElement('section');lit.id='literature';lit.style.cssText='max-width:1100px;margin:24px auto;padding:18px;border:1px solid #cddbd4;border-radius:16px;background:white';
lit.innerHTML='<h2>🔬 Literatura científica de acesso aberto</h2><p>Busque artigos científicos sobre qualquer tema de Biologia, com consulta simultânea ao Europe PMC e ao OpenAlex. SciELO disponível por pesquisa externa.</p><form id="litForm" style="display:flex;gap:8px;flex-wrap:wrap"><input id="litQuery" aria-label="Termo científico" placeholder="Ex.: cafeína, restinga, evolução" style="flex:1;min-width:180px;padding:12px;border:1px solid #b5c7be;border-radius:8px"><button class="btn" type="submit">Pesquisar artigos</button></form><label for="readingLevel" style="display:block;margin:12px 0 5px">Nível do guia de leitura:</label><select id="readingLevel" style="padding:9px;border-radius:8px;border:1px solid #b5c7be"><option value="school">Ensino Médio</option><option value="uni">Ensino Universitário</option></select><div id="litResults" aria-live="polite"></div>';
const v=document.getElementById('view');v.parentNode.insertBefore(lit,v.nextSibling);
const results=document.getElementById('litResults');
function makeCard(r){let box=document.createElement('article');box.style.cssText='border-top:1px solid #d7e2dc;padding:15px 0';let title=document.createElement('h3');title.style.margin='0 0 7px';let a=document.createElement('a');a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=r.title||'Sem título';title.appendChild(a);box.appendChild(title);let meta=document.createElement('p');meta.className='muted';meta.textContent=[r.authors.join(', '),r.journal,r.year,r.source].filter(Boolean).join(' · ');box.appendChild(meta);if(r.doi){let p=document.createElement('p');p.textContent='DOI: '+r.doi;box.appendChild(p)}if(r.abstract){let p=document.createElement('p');p.textContent=r.abstract.slice(0,650)+(r.abstract.length>650?'…':'');box.appendChild(p)}
let btn=document.createElement('button');btn.className='btn secondary';btn.textContent='📖 Guia de leitura do artigo';btn.style.marginTop='8px';box.appendChild(btn);
let panel=document.createElement('div');panel.className='hidden';panel.style.cssText='margin-top:12px;padding:15px;border-radius:12px;background:#f0f7f3';box.appendChild(panel);
btn.onclick=()=>{if(!panel.classList.contains('hidden')){panel.classList.add('hidden');return}panel.classList.remove('hidden');panel.replaceChildren();
let heading=document.createElement('h3');heading.textContent='Leitura orientada — '+(document.getElementById('readingLevel').value==='school'?'Ensino Médio':'Universitário');panel.appendChild(heading);
let warning=document.createElement('p');warning.className='muted';warning.textContent='Orientação pedagógica gerada a partir dos metadados e do resumo disponível. Não é tradução, revisão do texto integral ou validação das conclusões.';panel.appendChild(warning);
const level=document.getElementById('readingLevel').value;
const prompts=level==='school'?['Qual é o assunto investigado? Identifique as palavras centrais do título.','O resumo informa quais organismos, células, sistemas ou ambientes foram estudados?','Que resultado os autores apresentam? Diferencie o que foi observado da interpretação.','Como esse assunto se relaciona com os conteúdos de Biologia que você estuda?']:['Qual é a pergunta de pesquisa ou hipótese central?','Qual desenho de estudo, amostragem e metodologia são descritos?','Quais resultados e limitações aparecem no resumo?','A conclusão é sustentada pelos dados apresentados? Consulte o texto integral antes de responder.'];
